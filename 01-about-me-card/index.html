    <!--
    ==========================================
    EXERCISE 1: "ABOUT ME" INTERACTIVE CARD
    ==========================================

    What you'll build:
    A webpage with your name, a photo, a short bio,
    and a button that reveals a fun fact.

    REQUIREMENTS:

    1. A heading with your name
    2. A paragraph with a short bio (2-3 sentences)
    3. An image
    4. A button labeled "Show a fun fact"
    5. Button reveals a hidden fun fact
    6. Clicking again hides the fun fact
    7. Style the card
    ==========================================
    -->
    
    <h1>I'm Oliver Plaza.</h1>

    <p>"Aspiring web dev, eager to learn new things in the tech industry. 
        I'd like to build responsive websites and web applications." </p>

        <img src="blog.jpg" id="img" alt="photo of oliver">

    <div class="btn">
        <button id="fact-btn">Show a fun fact</button>
        <p id="fun-fact" style="display: none;">Your Fun fact Here</p>
    </div>    

<script src="script.js"></script>
